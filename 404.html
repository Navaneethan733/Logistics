<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Stackly Logistics</title>
  <meta name="description" content="The page you are looking for is not available. Return to Stackly Logistics – trusted global freight and supply chain solutions." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── 404 page specific styles (extend main design system) ── */
    .error-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--off-white);
      padding: 120px 24px 80px;
      position: relative;
      overflow: hidden;
    }

    /* subtle background pattern / watermark */
    .error-section::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle at 20% 30%, rgba(45,212,191,0.04) 0%, transparent 30%),
                        radial-gradient(circle at 80% 70%, rgba(45,212,191,0.04) 0%, transparent 30%);
      pointer-events: none;
    }

    .error-container {
      max-width: 680px;
      margin: 0 auto;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    /* big 404 graphic */
    .error-code {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(100px, 22vw, 200px);
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -6px;
      color: var(--primary);
      position: relative;
      display: inline-block;
      margin-bottom: 8px;
      user-select: none;
    }

    /* accent circle behind the 0 */
    .error-code .zero-accent {
      position: relative;
      display: inline-block;
      color: var(--accent);
    }

    .error-code .zero-accent::after {
      content: '';
      position: absolute;
      inset: -6px -10px;
      border: 4px dashed var(--accent);
      border-radius: 50%;
      opacity: 0.35;
      animation: spinSlow 12s linear infinite;
      pointer-events: none;
    }

    @keyframes spinSlow {
      to { transform: rotate(360deg); }
    }

    .error-title {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(26px, 3.5vw, 42px);
      font-weight: 800;
      color: var(--text-dark);
      letter-spacing: -1px;
      line-height: 1.2;
      margin-bottom: 16px;
    }

    .error-desc {
      font-size: 16px;
      color: var(--text-light);
      line-height: 1.75;
      max-width: 480px;
      margin: 0 auto 40px;
    }

    .error-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 48px;
    }

    .error-actions .btn-primary {
      background: var(--accent);
      color: var(--text-dark);
      border: 2px solid var(--accent);
    }
    .error-actions .btn-primary:hover {
      background: transparent;
      color: var(--accent);
    }

    /* secondary button on light background */
    .btn-outline-dark {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      color: var(--text-dark);
      font-weight: 600;
      font-size: 15px;
      padding: 14px 28px;
      border-radius: 50px;
      border: 2px solid var(--border);
      transition: all 0.3s cubic-bezier(.4,0,.2,1);
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }
    .btn-outline-dark:hover {
      border-color: var(--accent);
      color: var(--accent-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(45,212,191,0.15);
    }

    /* decorative compass / logistics watermark */
    .error-deco {
      position: absolute;
      right: -60px;
      top: 50%;
      transform: translateY(-50%);
      width: 280px;
      height: 280px;
      opacity: 0.25;
      pointer-events: none;
      z-index: 0;
    }

    .error-deco svg {
      width: 100%;
      height: 100%;
    }

    /* quick links to key sections */
    .quick-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px 28px;
      flex-wrap: wrap;
      padding-top: 32px;
      border-top: 1px solid var(--border);
      margin-top: 8px;
    }

    .quick-nav a {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-light);
      transition: color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .quick-nav a:hover {
      color: var(--accent-dark);
    }
    .quick-nav a .arrow-icon {
      font-size: 12px;
      opacity: 0.6;
    }

    /* subtle floating animation for the 404 */
    .error-code {
      animation: floatCode 4s ease-in-out infinite;
    }
    @keyframes floatCode {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* responsive tweaks */
    @media (max-width: 768px) {
      .error-section {
        padding: 100px 20px 60px;
      }
      .error-code {
        letter-spacing: -3px;
        margin-bottom: 0;
      }
      .error-deco {
        right: -100px;
        opacity: 0.15;
        width: 200px;
        height: 200px;
      }
      .error-actions {
        flex-direction: column;
        width: 100%;
      }
      .error-actions .btn-primary,
      .error-actions .btn-outline-dark {
        width: 100%;
        justify-content: center;
      }
      .quick-nav {
        gap: 12px 20px;
      }
    }

    @media (max-width: 480px) {
      .error-code {
        font-size: 100px;
      }
      .error-title {
        font-size: 24px;
      }
      .error-desc {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>

  <!-- ══════════════════════════════════════
       LOGO HEADER
  ══════════════════════════════════════ -->
  <header style="position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(13,31,53,0.95);backdrop-filter:blur(20px);padding:14px 24px;box-shadow:0 4px 24px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:space-between;">
    <a href="index.html" id="logo-link">
      <img src="images/Logo.webp" alt="Stackly Logistics Logo" class="logo-img" />
    </a>
    <a href="login.html" id="header-login-btn" style="display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#2dd4bf,#0f9484);color:#0d1f35;font-weight:700;font-size:13px;padding:10px 20px;border-radius:50px;text-decoration:none;"><i class="fa-solid fa-right-to-bracket"></i> Login</a>
  </header>

  <!-- ══════════════════════════════════════
       404 ERROR SECTION
  ══════════════════════════════════════ -->
  <section class="error-section" id="error-page">
    <!-- decorative watermark -->
    <div class="error-deco" aria-hidden="true">
      <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="100" r="85" stroke="#2dd4bf" stroke-width="1.6" opacity="0.3"/>
        <ellipse cx="100" cy="100" rx="85" ry="34" stroke="#2dd4bf" stroke-width="1.6" opacity="0.35"/>
        <ellipse cx="100" cy="100" rx="34" ry="85" stroke="#2dd4bf" stroke-width="1.6" opacity="0.35"/>
        <line x1="15" y1="100" x2="185" y2="100" stroke="#2dd4bf" stroke-width="1.6" opacity="0.3"/>
        <line x1="100" y1="15" x2="100" y2="185" stroke="#2dd4bf" stroke-width="1.6" opacity="0.3"/>
        <circle cx="100" cy="100" r="8" fill="#2dd4bf" opacity="0.45"/>
        <circle cx="100" cy="100" r="18" stroke="#2dd4bf" stroke-width="1" opacity="0.2" stroke-dasharray="3 6"/>
      </svg>
    </div>

    <div class="error-container">
      <!-- 404 number with accent zero -->
      <div class="error-code" aria-hidden="true">
        4<span class="zero-accent">0</span>4
      </div>

      <h1 class="error-title">Lost in Transit?</h1>

      <p class="error-desc">
        The page you are looking for has been moved, removed, or is temporarily unavailable. 
        Let’s get your journey back on the right route.
      </p>

      <!-- action buttons -->
      <div class="error-actions">
        <button class="btn-primary" id="go-back-btn" onclick="window.history.back()">
          ← Go Back
        </button>
      </div>
    </div>
  </section>

  <!-- ══════════════════════════════════════
       TOAST (optional, for consistency)
  ══════════════════════════════════════ -->
  <div class="toast" id="toast">✓ You will be redirected to the home page.</div>

  <script>
    // ── Hamburger menu (same behavior as main) ─────────────────
    const hamburger = document.getElementById('hamburger');
    const navLinks = document.getElementById('nav-links');
    if (hamburger && navLinks) {
      hamburger.addEventListener('click', () => {
        navLinks.classList.toggle('open');
        hamburger.classList.toggle('active');
        const spans = hamburger.querySelectorAll('span');
        if (hamburger.classList.contains('active')) {
          spans[0].style.transform = 'rotate(45deg) translate(5px, 5px)';
          spans[1].style.opacity = '0';
          spans[2].style.transform = 'rotate(-45deg) translate(5px, -5px)';
        } else {
          spans[0].style.transform = '';
          spans[1].style.opacity = '';
          spans[2].style.transform = '';
        }
      });
      navLinks.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', () => {
          navLinks.classList.remove('open');
          hamburger.classList.remove('active');
          hamburger.querySelectorAll('span').forEach(s => {
            s.style.transform = '';
            s.style.opacity = '';
          });
        });
      });
    }

    // ── Toast on quick redirect (if user clicks anywhere else) ─
    // Just a subtle interactive touch for the "Back to Home" if needed.
    // But we keep it simple – no auto toast.

    // ── Scroll reveal for the error container (already visible) ─
    // Optional: add a small entrance effect for the container
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.querySelector('.error-container');
      if (container) {
        container.style.opacity = '0';
        container.style.transform = 'translateY(20px)';
        container.style.transition = 'opacity 0.8s cubic-bezier(.4,0,.2,1), transform 0.8s cubic-bezier(.4,0,.2,1)';
        setTimeout(() => {
          container.style.opacity = '1';
          container.style.transform = 'translateY(0)';
        }, 100);
      }
    });

    // ── Navbar scroll effect (copied, but navbar is already scrolled) ─
    // Keep it working if user scrolls
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 60) {
        navbar.classList.add('scrolled');
        navbar.style.background = 'rgba(13,31,53,0.95)';
        navbar.style.backdropFilter = 'blur(20px)';
        navbar.style.padding = '12px 0';
        navbar.style.boxShadow = '0 4px 24px rgba(0,0,0,0.3)';
      } else {
        // Since this is 404 page, we keep it scrolled style always
        // But we can toggle based on scroll for consistency
        if (window.scrollY <= 60) {
          navbar.style.background = 'rgba(13,31,53,0.95)';
          navbar.style.backdropFilter = 'blur(20px)';
          navbar.style.padding = '12px 0';
          navbar.style.boxShadow = '0 4px 24px rgba(0,0,0,0.3)';
        }
      }
    });

    // ── Smooth scroll for anchor links within page ────────────
    document.querySelectorAll('a[href^="index.html"]').forEach(anchor => {
      // let them navigate normally, no need to smooth scroll since it's a different page
    });
  </script>

  <!-- Smart Nav: swap Login→Dashboard when logged in -->
  <script>
    (function(){
      var user = sessionStorage.getItem('sl_user');
      var btn = document.getElementById('header-login-btn');
      if(user && btn){
        btn.href = 'signout.html';
        btn.innerHTML = '<i class=\'fa-solid fa-gauge\'></i> Dashboard';
      }
    })();
  </script>
</body>
</html>
